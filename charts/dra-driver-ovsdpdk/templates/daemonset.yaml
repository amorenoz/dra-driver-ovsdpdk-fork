apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}
      hostPID: true
      initContainers:
        - name: init-users
          image: {{ include "chart.image" . }}
          command:
            - sh
            - -c
            - |
              nsenter --mount=/proc/1/ns/mnt -- getent passwd > /user-db/passwd
              nsenter --mount=/proc/1/ns/mnt -- getent group  > /user-db/group
              echo "Populated passwd and group from host NSS"
              cat /user-db/passwd | wc -l
              cat /user-db/group  | wc -l
          securityContext:
            privileged: true
          volumeMounts:
            - name: user-db
              mountPath: /user-db
      containers:
        - name: driver
          image: {{ include "chart.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/bin/dra-driver-ovsdpdk
            - --node-name=$(NODE_NAME)
            - --namespace=$(NAMESPACE)
            - --enable-device-metadata
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: true
          {{- if not (empty .Values.hugepages) }}
          resources:
            limits:
              {{- range $key, $val := .Values.hugepages }}
              {{ $key }}: {{ $val }}
              {{- end }}
            requests:
              {{- range $key, $val := .Values.hugepages }}
              {{ $key }}: {{ $val }}
              {{- end }}
          {{- end }}
          volumeMounts:
            {{- if not (empty .Values.hugepages) }}
            - name: hugepages
              mountPath: /dev/hugepages
            {{- end }}
            - name: user-db
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: user-db
              mountPath: /etc/group
              subPath: group
              readOnly: true
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdi-root
              mountPath: /var/run/cdi
            - name: socket-root
              mountPath: /var/run/ovsdpdk
            - name: ovs-run
              mountPath: /var/run/openvswitch
      volumes:
        {{- if not (empty .Values.hugepages) }}
        - name: hugepages
          emptyDir:
            medium: HugePages
        {{- end }}
        - name: user-db
          emptyDir: {}
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: kubelet-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: DirectoryOrCreate
        - name: cdi-root
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: socket-root
          hostPath:
            path: /var/run/ovsdpdk
            type: DirectoryOrCreate
        - name: ovs-run
          hostPath:
            path: /var/run/openvswitch
            type: DirectoryOrCreate
